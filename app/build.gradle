plugins { id 'com.android.application' }
android {
    namespace 'it.wzupa.cwz'
    compileSdk 35
    buildToolsVersion '35.0.0'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'it.wzupa.cwz'
        minSdk 26
        targetSdk 35
        versionCode 60703
        versionName '6.7.3'
    }
    sourceSets { main { assets.srcDir layout.buildDirectory.dir('generated/cwzAssets') } }
}
tasks.register('copyCwzHtml', Copy) {
    from rootProject.file('CWZ_v6_7_3.html')
    into layout.buildDirectory.dir('generated/cwzAssets')
    rename { 'index.html' }
}
tasks.named('preBuild').configure { dependsOn 'copyCwzHtml' }
