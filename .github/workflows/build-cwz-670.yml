name: Build CWZ 6.7.8
on:
  push:
    branches: [main]
    paths:
      - 'CWZ_v6_7_8.html'
      - 'tests/group-validation-678.test.cjs'
      - 'settings.gradle'
      - 'app/**'
      - '.github/workflows/build-cwz-670.yml'
  workflow_dispatch:
concurrency:
  group: cwz-678-build-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "Android SDK manager not installed" >&2; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Install circular CWZ Android icon
        run: base64 --decode app/cwz-logo-base64.txt > app/src/main/res/drawable/ic_cwz.webp
      - name: Regression tests for incomplete-group validation
        run: node --test tests/group-validation-678.test.cjs
      - name: Compile Android APK and run Android unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Name and checksum APK
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/CWZ-6.7.8-debug.apk
          cp CWZ_v6_7_8.html downloads/CWZ-6.7.8.html
          sha256sum downloads/CWZ-6.7.8-debug.apk > downloads/CWZ-6.7.8-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CWZ-6.7.8-APK
          path: |
            downloads/CWZ-6.7.8-debug.apk
            downloads/CWZ-6.7.8-debug.apk.sha256
            downloads/CWZ-6.7.8.html
          retention-days: 30
